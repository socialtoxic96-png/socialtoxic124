```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Toxic - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>SOCIAL TOXIC</h1>
        <p class="auth-subtitle">Enter the community</p>

        <!-- LOGIN -->
        <div id="loginPanel" class="auth-panel active">

            <h2>LOGIN</h2>

            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    LOGIN
                </button>

            </form>

            <div id="loginMessage"
                 class="auth-message">
            </div>

            <p>
                Don't have an account?
                <button
                    type="button"
                    class="switch-button"
                    onclick="showSignup()">
                    SIGN UP
                </button>
            </p>

        </div>


        <!-- SIGN UP -->
        <div id="signupPanel" class="auth-panel">

            <h2>CREATE ACCOUNT</h2>

            <form id="signupForm">

                <input
                    id="signupUsername"
                    type="text"
                    placeholder="Username"
                    minlength="3"
                    maxlength="20"
                    required
                >

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password"
                    minlength="6"
                    required
                >

                <div class="avatar-section">

                    <p>Choose avatar</p>

                    <button
                        type="button"
                        class="avatar-choice selected"
                        data-avatar="ST">
                        ST
                    </button>

                    <button
                        type="button"
                        class="avatar-choice"
                        data-avatar="TX">
                        TX
                    </button>

                    <button
                        type="button"
                        class="avatar-choice"
                        data-avatar="NX">
                        NX
                    </button>

                </div>

                <button type="submit">
                    CREATE ACCOUNT
                </button>

            </form>

            <div id="signupMessage"
                 class="auth-message">
            </div>

            <p>
                Already have an account?
                <button
                    type="button"
                    class="switch-button"
                    onclick="showLogin()">
                    LOGIN
                </button>
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
```
