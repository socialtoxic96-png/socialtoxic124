<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community | Social Toxic</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="particles"></div>

<header>
    <a href="index.html" class="logo">SOCIAL<span>TOXIC</span></a>

    <nav>
        <a href="index.html">HOME</a>
        <a href="trending.html">TRENDING</a>
        <a class="active" href="community.html">COMMUNITY</a>
        <a href="profile.html">PROFILE</a>
    </nav>

    <div class="nav-right">
        <span id="navUser"></span>
        <button class="menu-btn">☰</button>
    </div>
</header>

<main class="page-transition">

<section class="page-hero">

    <span class="eyebrow">SOCIAL NETWORK</span>

    <h1>
        THE<br>
        <span>COMMUNITY</span>
    </h1>

    <p>
        Share your thoughts with the Social Toxic universe.
    </p>

</section>

<section class="community-layout">

    <div>

        <div class="create-box">

            <div class="create-user">
                <div id="createAvatar" class="mini-avatar">ST</div>

                <strong id="createUsername">
                    Guest
                </strong>
            </div>

            <textarea
                id="postText"
                placeholder="What's happening?"
            ></textarea>

            <div class="create-footer">

                <span id="postStatus">
                    Ready to post
                </span>

                <button
                    class="btn primary"
                    onclick="createPost()">
                    POST
                </button>

            </div>

        </div>

        <div id="postsContainer"></div>

    </div>

    <aside class="rooms">

        <h3>PUBLIC ROOMS</h3>

        <div class="room">
            <span class="online"></span>
            <div>
                <b>Gaming Zone</b>
                <small>1,842 online</small>
            </div>
        </div>

        <div class="room">
            <span class="online"></span>
            <div>
                <b>Technology</b>
                <small>934 online</small>
            </div>
        </div>

        <div class="room">
            <span class="online"></span>
            <div>
                <b>Creative Hub</b>
                <small>721 online</small>
            </div>
        </div>

        <div class="room">
            <span class="online"></span>
            <div>
                <b>Gaming Community</b>
                <small>421 online</small>
            </div>
        </div>

    </aside>

</section>

</main>

<footer>
    <span>© 2026 SOCIAL TOXIC</span>
</footer>

<script src="script.js"></script>

</body>
</html>
